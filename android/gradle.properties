org.gradle.jvmargs=-Xmx4G -XX:MaxMetaspaceSize=2G -XX:+HeapDumpOnOutOfMemoryError
android.useAndroidX=true
android.enableJetifier=true
# This builtInKotlin flag was added automatically by Flutter migrator
android.builtInKotlin=false
# Android Gradle Plugin 9.0+ requires the new DSL for variant-level resources
# (resValue moved to resourceValues). Enabled per AGP 9 requirement.
android.newDsl=false
# AGP 9 flipped android.uniquePackageNames from false to true, so any two AARs
# sharing a namespace is a hard manifest-merger failure. The embedded Cronet
# stack (org.chromium.net:cronet-embedded -> cronet-api + cronet-shared +
# cronet-common) ships that exact duplicate namespace, and there is no newer
# cronet_http to fix it (1.9.0 is latest, pulled in by native_dio_adapter).
# Google's documented interim mitigation: restore the AGP 8 warning behaviour
# until the AARs get unique namespaces.
android.uniquePackageNames=false

