plugins {
    id "com.android.application"
    // The Flutter Gradle Plugin must be applied after the Android and Kotlin Gradle plugins.
    id "dev.flutter.flutter-gradle-plugin"
    id "org.jetbrains.kotlin.plugin.compose"
}

android {
    namespace = "id.nhasix.app"
    compileSdk = 37
    ndkVersion = flutter.ndkVersion

    compileOptions {
        sourceCompatibility = JavaVersion.VERSION_17
        targetCompatibility = JavaVersion.VERSION_17
        coreLibraryDesugaringEnabled true
    }

    buildFeatures {
        compose true
    }

    // Universal-diet: single universal APK ships ARM only. Flutter-built libs
    // are limited via --target-platform (build_optimized.sh); AAR-bundled
    // .so (ffmpeg/onnxruntime/cronet) ignore that, so strip their x86_64
    // copies here at packaging time.
    // Also exclude libcnativeapi.so (transitive from desktop-only window_manager).
    packaging {
        jniLibs {
            excludes += "lib/x86_64/**"
            excludes += "lib/**/libcnativeapi.so"
        }
    }

    defaultConfig {
        applicationId = "id.nhasix.app"
        // You can update the following values to match your application needs.
        // For more information, see: https://flutter.dev/to/review-gradle-config.
        minSdk = flutter.minSdkVersion
        targetSdk = flutter.targetSdkVersion
        versionCode = flutter.versionCode
        versionName = flutter.versionName
        // NOTE: ABI filtering is NOT done here — the Flutter Gradle plugin
        // overrides ndk.abiFilters. See scripts/build_optimized.sh
        // (--target-platform android-arm,android-arm64 for release).
    }
    signingConfigs {
        release {
            // Load key.properties file
            def keystoreProperties = new Properties()
            def keystorePropertiesFile = rootProject.file('key.properties')
            if (keystorePropertiesFile.exists()) {
                keystoreProperties.load(new FileInputStream(keystorePropertiesFile))
            }

            keyAlias = keystoreProperties['keyAlias'] ?: System.getenv("ALIAS_NAME")
            keyPassword = keystoreProperties['keyPassword'] ?: System.getenv("KEY_PASSWORD")
            storeFile = keystoreProperties['storeFile'] ? file(keystoreProperties['storeFile']) : null
            storePassword = keystoreProperties['storePassword'] ?: System.getenv("STORE_PASSWORD")
            
            // Allow override via ENV (for CI) if storeFile isn't in properties
            if (storeFile == null && System.getenv("KEYSTORE_PATH") != null) {
                storeFile = file(System.getenv("KEYSTORE_PATH"))
            }

            // CI/CD: Decode KEYSTORE_BASE64 if present
            if (System.getenv("KEYSTORE_BASE64") != null) {
                def keystoreFile = file("${project.buildDir}/release.jks")
                keystoreFile.parentFile.mkdirs()
                keystoreFile.bytes = System.getenv("KEYSTORE_BASE64").decodeBase64()
                storeFile = keystoreFile
            }

            // QA gate #88 (scripts/qa_verify_release_apk.sh): the release
            // APK must verify under BOTH v2 and v3 schemes.
            v1SigningEnabled true
            v2SigningEnabled true
            enableV3Signing true
            enableV4Signing false
        }
    }

    buildTypes {
        debug {
            applicationIdSuffix ".debug"
        }
        release {
            // Fail-fast release signing: a release APK must never ship debug-signed silently.
            // Provide android/key.properties or KEYSTORE_BASE64/KEYSTORE_PATH.
            // ALLOW_DEBUG_SIGNING=true is only for local throwaway builds.
            if (signingConfigs.release.storeFile != null && signingConfigs.release.storeFile.exists()) {
                signingConfig signingConfigs.release
            } else if (System.getenv("ALLOW_DEBUG_SIGNING") == "true") {
                logger.warn("Release signing keys missing — debug signing explicitly allowed via ALLOW_DEBUG_SIGNING=true (local throwaway builds only).")
                signingConfig signingConfigs.debug
            } else {
                throw new GradleException(
                    "Release keystore missing. Provide android/key.properties or KEYSTORE_BASE64/KEYSTORE_PATH. " +
                    "Set ALLOW_DEBUG_SIGNING=true only for local throwaway builds.")
            }
            minifyEnabled true
            shrinkResources true
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }

    // Flavor-based app name + applicationId. AGP 9 dropped resValue; use
    // static-per-flavor manifestPlaceholders (no AGP resource DSL required).
    // Prod: flavor "prod" → Kuron / id.nhasix.app
    // Dev:   flavor "dev"  → Kuron Dev / id.nhasix.app.dev (sideload builds)
    flavorDimensions += "app"
    productFlavors {
        prod {
            dimension "app"
            manifestPlaceholders = [appName: "Kuron"]
        }
        dev {
            dimension "app"
            applicationId "id.nhasix.app.dev"
            manifestPlaceholders = [appName: "Kuron Dev"]
        }
    }

    // Note: ABI splits handled by Flutter's --split-per-abi flag
    // Don't use gradle splits.abi as it conflicts with Flutter's ndk.abiFilters

}

// Custom APK naming with ABI support: kuron_[version]_[date]_[buildType]_[abi].apk
// (androidComponents API — the legacy applicationVariants DSL is retired.
// android.newDsl=false stays: the Flutter Gradle plugin still applies the
// legacy kotlin-android plugin, which rejects the AGP 9 new DSL.)
androidComponents {
    onVariants(selector().all()) { variant ->
        variant.outputs.forEach { output ->
            def versionName = output.versionName.get()
            def buildType = variant.buildType
            def date = new Date().format('yyyyMMdd')
            def abi = output.filters
                .find { it.filterType.name() == 'ABI' }
                ?.identifier ?: 'universal'

            // Custom filename format: kuron_[version]_[date]_[buildType]_[abi].apk
            def fileName = "kuron_${versionName}_${date}_${buildType}_${abi}.apk"
            output.outputFileName.set(fileName)
        }
    }
}

kotlin {
    compilerOptions {
        jvmTarget = org.jetbrains.kotlin.gradle.dsl.JvmTarget.JVM_17
    }
}

flutter {
    source = "../.."
}

dependencies {
    coreLibraryDesugaring 'com.android.tools:desugar_jdk_libs:2.1.4'
    
    // AndroidX dependencies for PDF Reader
    implementation 'androidx.appcompat:appcompat:1.6.1'
    implementation 'com.google.android.material:material:1.11.0'
    
    // Native download dependencies
    implementation 'androidx.work:work-runtime-ktx:2.12.0'
    implementation 'com.squareup.okhttp3:okhttp:5.5.1'
    implementation 'com.squareup.okhttp3:logging-interceptor:5.5.1'
    implementation 'com.squareup.okhttp3:okhttp-dnsoverhttps:5.5.1'  // NEW: DNS-over-HTTPS
    implementation 'org.jetbrains.kotlinx:kotlinx-coroutines-android:1.10.1'
    implementation 'com.jakewharton.timber:timber:5.0.1'
    implementation 'com.google.guava:guava:32.1.3-android'
    
    // Glance RemoteViews launcher widget (Kuro streak)
    implementation 'androidx.glance:glance-appwidget:1.1.1'
    
    // Testing dependencies (NEW)
    testImplementation 'junit:junit:4.13.2'
    testImplementation 'org.robolectric:robolectric:4.18.1'
    testImplementation 'androidx.work:work-testing:2.12.0'
    testImplementation 'org.jetbrains.kotlinx:kotlinx-coroutines-test:1.10.1'
    testImplementation 'androidx.test:core:1.5.0'
}
