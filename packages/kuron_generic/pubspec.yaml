name: kuron_generic
description: Generic config-driven HTTP source for Kuron app (JSON API + HTML scraping)
version: 0.1.0
publish_to: none

environment:
  sdk: ^3.5.4
resolution: workspace

dependencies:
  kuron_core:
    path: ../kuron_core
  equatable: ^2.0.7
  dio: ^5.9.0
  html: ^0.15.4
  json_path: ^0.9.0
  logger: ^2.6.2
  cookie_jar: ^4.0.9

dev_dependencies:
  flutter_lints: ^6.0.0
  test: ^1.25.0
  http_mock_adapter: ^0.6.1
