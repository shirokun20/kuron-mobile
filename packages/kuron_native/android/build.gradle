plugins {
    id "com.android.library"
}

// ── Rust FFI: cargo-ndk build ──────────────────────────────
def jniLibsDir = file("${projectDir}/src/main/jniLibs")

task buildRustLibs(type: Exec) {
    description = "Build Rust native libraries for Android via cargo-ndk"
    group = "rust"
    workingDir file("${projectDir}/../rust")
    commandLine 'cargo', 'ndk',
        '-o', jniLibsDir,
        '-t', 'arm64-v8a',
        '-t', 'armeabi-v7a',
        '-t', 'x86_64',
        'build', '--release'
    environment 'ANDROID_NDK_HOME',
        System.getenv('ANDROID_NDK_HOME') ?: "${project.android.ndkDirectory}"
}

tasks.whenTaskAdded { task ->
    if (task.name == 'preReleaseBuild' || task.name == 'preDebugBuild') {
        task.dependsOn buildRustLibs
        task.dependsOn downloadBubbleModel
    }
}

// ── ML model asset: download-at-build ────────────────────────
// Pinned by model.pin.json ({file, version, url, sha256}). First build
// downloads + verifies; later builds reuse the cached file. Override the
// URL for local verification: -PmodelUrl=file:///path/to/model.onnx
// or env KURON_MODEL_URL. Offline with empty cache fails loudly.
def modelPin = new groovy.json.JsonSlurper()
    .parseText(file("${projectDir}/model.pin.json").text)
def modelFile = file("${projectDir}/src/main/assets/${modelPin.file}")

task downloadBubbleModel {
    description = 'Download bubble_detector.onnx per model.pin.json (cached, SHA256-verified)'
    group = 'kuron'
    outputs.file(modelFile)
    doLast {
        if (!modelFile.exists()) {
            def modelUrl = project.findProperty('modelUrl')
                ?: System.getenv('KURON_MODEL_URL')
                ?: modelPin.url
            logger.lifecycle("Downloading model v${modelPin.version} from ${modelUrl} ...")
            modelFile.parentFile.mkdirs()
            ant.get(src: modelUrl, dest: modelFile)
            logger.lifecycle("Downloaded ${modelFile.length()} bytes.")
        } else {
            logger.lifecycle("Model asset cached: ${modelFile.name}")
        }
        def actual = java.security.MessageDigest.getInstance('SHA-256')
            .digest(modelFile.bytes).encodeHex().toString()
        if (actual != modelPin.sha256) {
            modelFile.delete()
            throw new GradleException(
                "Model SHA256 mismatch (expected ${modelPin.sha256}, got ${actual}). Check model.pin.json.")
        }
        logger.lifecycle("Model asset verified: ${modelFile.name} (${modelFile.length()} bytes).")
    }
}

group = "id.nhasix.kuron_native.kuron_native"
version = "1.0-SNAPSHOT"

android {
    namespace = "id.nhasix.kuron_native.kuron_native"

    compileSdk = 36

    compileOptions {
        sourceCompatibility = JavaVersion.VERSION_17
        targetCompatibility = JavaVersion.VERSION_17
    }

    kotlinOptions {
        jvmTarget = "17"
    }

    sourceSets {
        main.java.srcDirs += "src/main/kotlin"
        test.java.srcDirs += "src/test/kotlin"
    }

    defaultConfig {
        minSdk = 24
        consumerProguardFiles "proguard-rules.pro"
    }

    dependencies {
        testImplementation("org.jetbrains.kotlin:kotlin-test")
        testImplementation("org.mockito:mockito-core:5.0.0")

        // Native feature dependencies
        implementation 'androidx.browser:browser:1.8.0'
        implementation 'androidx.appcompat:appcompat:1.6.1'
        implementation 'androidx.core:core-ktx:1.12.0'
        implementation 'com.google.android.material:material:1.11.0'
        implementation 'androidx.recyclerview:recyclerview:1.3.2'
        implementation 'org.jetbrains.kotlinx:kotlinx-coroutines-android:1.7.3'
        implementation 'com.antonkarpenko:ffmpeg-kit-full-gpl:2.2.1'

        // Download dependencies
        implementation 'androidx.work:work-runtime-ktx:2.9.0'
        implementation 'com.squareup.okhttp3:okhttp:4.12.0'
        implementation 'com.squareup.okhttp3:okhttp-dnsoverhttps:4.12.0'
        implementation 'org.json:json:20231013'
        // ONNX Runtime for on-device bubble detection
        implementation 'com.microsoft.onnxruntime:onnxruntime-android:1.23.0'
    }

    testOptions {
        unitTests.all {
            useJUnitPlatform()

            testLogging {
               events "passed", "skipped", "failed", "standardOut", "standardError"
               outputs.upToDateWhen {false}
               showStandardStreams = true
            }
        }
    }
}
