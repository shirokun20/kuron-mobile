plugins {
    id "com.android.library"
}

// NOTE: `downloadBubbleModel` is intentionally NOT wired to preBuild — the
// model is a runtime download (change `onnx-runtime-download`), never an asset.

// ── ML model pin: runtime download, NOT an APK asset ──────────
// The 42MB `bubble_detector.onnx` is NO LONGER bundled: `downloadBubbleModel`
// stays only as a manual local task (`./gradlew :kuron_native:downloadBubbleModel`).
// `model.pin.json` (~1KB) IS bundled as an asset text — the single source of
// truth for {file, version, url, sha256}, read at runtime by Dart. Override the
// URL for local verification: -PmodelUrl=file:///path/to/model.onnx
// or env KURON_MODEL_URL.
def modelPin = new groovy.json.JsonSlurper()
    .parseText(file("${projectDir}/../../../assets/model.pin.json").text)
// Manual-task output only (NOT wired to any build): kept so
// `./gradlew :kuron_native:downloadBubbleModel` still verifies a local file.
def modelFile = file("${projectDir}/src/main/assets/${modelPin.file}")

task downloadBubbleModel {
    description = 'Download bubble_detector.onnx per model.pin.json (cached, SHA256-verified)'
    group = 'kuron'
    outputs.file(modelFile)
    doLast {
        if (!modelFile.exists()) {
            def modelUrl = project.findProperty('modelUrl')
                ?: System.getenv('KURON_MODEL_URL')
                ?: modelPin.url
            logger.lifecycle("Downloading model v${modelPin.version} from ${modelUrl} ...")
            modelFile.parentFile.mkdirs()
            ant.get(src: modelUrl, dest: modelFile)
            logger.lifecycle("Downloaded ${modelFile.length()} bytes.")
        } else {
            logger.lifecycle("Model asset cached: ${modelFile.name}")
        }
        def actual = java.security.MessageDigest.getInstance('SHA-256')
            .digest(modelFile.bytes).encodeHex().toString()
        if (actual != modelPin.sha256) {
            modelFile.delete()
            throw new GradleException(
                "Model SHA256 mismatch (expected ${modelPin.sha256}, got ${actual}). Check model.pin.json.")
        }
        logger.lifecycle("Model asset verified: ${modelFile.name} (${modelFile.length()} bytes).")
    }
}

group = "id.nhasix.kuron_native.kuron_native"
version = "1.0-SNAPSHOT"

android {
    namespace = "id.nhasix.kuron_native.kuron_native"

    compileSdk = 36

    compileOptions {
        sourceCompatibility = JavaVersion.VERSION_17
        targetCompatibility = JavaVersion.VERSION_17
    }

    kotlinOptions {
        jvmTarget = "17"
    }

    sourceSets {
        main.java.srcDirs += "src/main/kotlin"
        test.java.srcDirs += "src/test/kotlin"
    }

    defaultConfig {
        minSdk = 24
        consumerProguardFiles "proguard-rules.pro"
    }

    dependencies {
        testImplementation("org.jetbrains.kotlin:kotlin-test")
        testImplementation("org.mockito:mockito-core:5.0.0")

        // Native feature dependencies
        implementation 'androidx.browser:browser:1.8.0'
        implementation 'androidx.appcompat:appcompat:1.6.1'
        implementation 'androidx.core:core-ktx:1.12.0'
        implementation 'com.google.android.material:material:1.11.0'
        implementation 'androidx.recyclerview:recyclerview:1.3.2'
        implementation 'org.jetbrains.kotlinx:kotlinx-coroutines-android:1.7.3'
        implementation 'com.antonkarpenko:ffmpeg-kit-full-gpl:2.2.1'

        // Download dependencies
        implementation 'androidx.work:work-runtime-ktx:2.9.0'
        implementation 'com.squareup.okhttp3:okhttp:4.12.0'
        implementation 'com.squareup.okhttp3:okhttp-dnsoverhttps:4.12.0'
        implementation 'org.json:json:20231013'
        // ONNX Runtime for on-device bubble detection
        implementation 'com.microsoft.onnxruntime:onnxruntime-android:1.23.0'
    }

    testOptions {
        unitTests.all {
            useJUnitPlatform()

            testLogging {
               events "passed", "skipped", "failed", "standardOut", "standardError"
               outputs.upToDateWhen {false}
               showStandardStreams = true
            }
        }
    }
}
