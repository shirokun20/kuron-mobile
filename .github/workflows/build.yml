name: Build and Upload APK

# Trigger on:
# 1. Version tags (e.g. v0.8.0) — for release builds with GitHub Release
# 2. Manual trigger via GitHub Actions UI — for testing builds on demand
#
# ⚠️ Does NOT auto-trigger on every push to master to save Actions minutes.
# Use "Run workflow" button in Actions tab for on-demand builds.
#
# Notifications: Telegram Channel (not personal chat)
# Setup: Add bot as admin to channel, get channel ID (@channelname or -100XXXXXXXXX)
on:
  push:
    tags:
      - 'v*' # Trigger on version tags (e.g. v0.8.0)

  # Manual trigger with configurable options
  workflow_dispatch:
    inputs:
      build_type:
        description: 'Build type'
        required: true
        default: 'release'
        type: choice
        options:
          - release
          - debug
      split_abi:
        description: 'Split APK per ABI (OFF = single universal APK, recommended)'
        required: true
        default: false
        type: boolean
      upload_artifact:
        description: 'Upload APK as GitHub Artifact (downloadable from Actions tab)'
        required: true
        default: true
        type: boolean

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:

      contents: write # Required for creating releases

    steps:
      # Checkout repository
      - uses: actions/checkout@v5

      # Setup Java environment
      - name: Setup Java
        uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: '17'

      # Setup Flutter environment
      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'

      # Verify Flutter and Android setup
      - name: Verify Setup
        run: |
          echo "=== Flutter Version ==="
          flutter --version
          echo ""
          echo "=== Flutter Doctor ==="
          flutter doctor -v
          echo ""
          echo "=== Android SDK Location ==="
          echo "$ANDROID_HOME"
          ls -la "$ANDROID_HOME" || echo "Android SDK not found"

      # Android NDK detection — Gradle's android.ndkDirectory resolves whichever
      # NDK version flutter.ndkVersion points to.
      - name: Detect NDK
        run: |
          NDK_DIR=$(ls -1d "$ANDROID_HOME/ndk"/*/ 2>/dev/null | sort -V | tail -1)
          if [ -n "$NDK_DIR" ]; then
            echo "ANDROID_NDK_HOME=$NDK_DIR" >> "$GITHUB_ENV"
            echo "ANDROID_NDK_ROOT=$NDK_DIR" >> "$GITHUB_ENV"
            echo "Using NDK: $NDK_DIR"
          else
            echo "WARNING: No NDK found!" >&2
          fi


      # Install all project dependencies (including local packages)
      - name: Get Dependencies
        run: flutter pub get

      # Generate localization files from ARB sources (lib/l10n/)
      # This ensures app_localizations.dart is up to date
      - name: Generate Localizations
        run: flutter gen-l10n || echo "gen-l10n not configured, skipping"

      # Run build_runner for Freezed/JsonSerializable code generation
      # Generates .g.dart and .freezed.dart files (gitignored, never committed).
      # Strict (no `|| echo` swallow): codegen failure must fail the build early.
      - name: Run Build Runner
        run: flutter pub run build_runner build

      # Decode Keystore from Secrets
      # Only runs if KEYSTORE_BASE64 secret is configured
      # Skip gracefully for forks without signing setup
      - name: Decode Keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        if: env.KEYSTORE_BASE64 != ''
        run: |
          echo "$KEYSTORE_BASE64" | base64 --decode > android/app/upload-keystore.jks
          echo "Keystore decoded to android/app/upload-keystore.jks"

      # Make build script executable
      - name: Prepare Build Script
        run: chmod +x scripts/build_optimized.sh

      # Build optimized APK (universal single-file by default)
      # Respects workflow_dispatch inputs for build type and ABI splitting
      # Tag-triggered builds always use release + universal
      # Falls back to debug build if no keystore secrets configured
      - name: Build APK
        env:
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
          STORE_PASSWORD: ${{ secrets.STORE_PASSWORD }}
          ALIAS_NAME: ${{ secrets.ALIAS_NAME }}
          KEYSTORE_PATH: "upload-keystore.jks" # Relative to android/app/
          BUILD_TYPE: ${{ github.event.inputs.build_type || 'release' }}
          SPLIT_ABI: ${{ github.event.inputs.split_abi || 'false' }}
        run: |
          echo "📋 Build config: type=$BUILD_TYPE, split_abi=$SPLIT_ABI"

          # Determine split flag (default OFF = single universal APK)
          SPLIT_FLAG=""
          if [ "$SPLIT_ABI" = "true" ]; then
            SPLIT_FLAG="--split-per-abi"
            echo "📦 Split per ABI enabled"
          else
            echo "📦 Universal APK (single file, all ABIs)"
          fi

          if [ -f "android/app/upload-keystore.jks" ]; then
            echo "🔐 Building signed $BUILD_TYPE APK (flavor: prod)..."
            FLAVOR=prod ./scripts/build_optimized.sh $BUILD_TYPE
          else
            echo "⚠️ No keystore found, building $BUILD_TYPE APK without signing (flavor: prod)..."
            flutter build apk --$BUILD_TYPE --flavor prod $SPLIT_FLAG --dart-define=cronetHttpNoPlay=true
            mkdir -p apk-output
            cp build/app/outputs/apk/prod/$BUILD_TYPE/kuron_*.apk apk-output/ 2>/dev/null || true
            cp build/app/outputs/flutter-apk/kuron_*.apk apk-output/ 2>/dev/null || true
          fi

      # Verify build outputs
      - name: Verify Build Outputs
        run: |
          echo "=== Checking Flutter APK Directory ==="
          ls -la build/app/outputs/flutter-apk/ || echo "No flutter-apk directory"
          echo ""
          echo "=== Checking APK Output Directory ==="
          ls -lh apk-output/ 2>/dev/null || echo "No apk-output directory"
          echo ""
          echo "=== All APK Files ==="
          find build/ -name "*.apk" -exec ls -lh {} \; 2>/dev/null || echo "No APK files found"

      # Upload APK as GitHub Artifact (kuron_* universal only)
      # Available for download from the Actions tab (even without a release)
      # Retained for 30 days — useful for testing and CI verification
      # Controlled by workflow_dispatch input (always enabled for tag builds)
      - name: Upload APK Artifacts
        if: ${{ github.event.inputs.upload_artifact != 'false' }}
        uses: actions/upload-artifact@v4
        with:
          name: kuron-apk-${{ github.sha }}
          path: |
            apk-output/kuron_*.apk
            build/app/outputs/apk/prod/**/kuron_*.apk
            build/app/outputs/flutter-apk/kuron_*.apk
          if-no-files-found: warn
          retention-days: 30

      # Notify on build failure to Telegram Channel (message only, no APK upload)
      # Only sends if TELEGRAM_BOT_TOKEN secret is configured
      - name: Notify Build Failure
        if: failure()
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHANNEL_ID: ${{ secrets.TELEGRAM_CHANNEL_ID }}
        run: |
          # ponytail: big-picker — 1 pesan random biar nggak template, tambah varian di sini aja
          FAIL_MSGS=(
            "Yah bos, build-nya ambyar nih 😭"
            "Duh bos, build gagal lagi, ampun dah 🙏"
            "Bosss, CI-nya merah nih, tolong dilirik 🔴"
            "Waduh bos, build-nya nyungsep, cek gih 🛠️"
            "Hadehh bos, build rungkad, meluncur ke logs yak 🏃"
            "Bos, build-nya zonk nih, jangan sedih, kita benerin 💪"
          )
          PICK=${FAIL_MSGS[$RANDOM % ${#FAIL_MSGS[@]}]}
          curl -s -X POST "https://api.telegram.org/bot$TELEGRAM_BOT_TOKEN/sendMessage" \
            -d chat_id="$TELEGRAM_CHANNEL_ID" \
            -d parse_mode="Markdown" \
            -d text="
          ${PICK}

          commit \`${GITHUB_SHA::8}\` @ ${GITHUB_REF_NAME} oleh ${GITHUB_ACTOR} — [intip logs](https://github.com/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID})
          "

      # Notify on build success to Telegram Channel (message only, no APK upload)
      # Only sends if TELEGRAM_BOT_TOKEN secret is configured
      - name: Notify Build Success
        if: success()
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHANNEL_ID: ${{ secrets.TELEGRAM_CHANNEL_ID }}
        run: |
          # ponytail: big-picker — 1 pesan random biar nggak template, tambah varian di sini aja
          OK_MSGS=(
            "Gas bos, build kelar, ijo semua 🟢"
            "Cihuy bos, build-nya jadi nih, gaskeun 🎉"
            "Anjay bos, build sukses, mantap jiwa 🔥"
            "Beres bos, APK universal udah mateng, tinggal sikat 🚀"
            "Sabi bos, build lolos tanpa drama, download gih 😎"
            "Wih bos, build-nya mulus kayak jalan tol, mantap 🛣️"
          )
          PICK=${OK_MSGS[$RANDOM % ${#OK_MSGS[@]}]}
          APK_LINE="APK universal siap"
          for apk in apk-output/kuron_*.apk build/app/outputs/flutter-apk/kuron_*.apk; do
            if [ -f "$apk" ]; then
              size=$(du -h "$apk" | cut -f1)
              APK_LINE="$(basename "$apk") (${size})"
              break
            fi
          done
          # Escape underscores so Telegram Markdown doesn't choke on filenames
          APK_LINE=$(echo "$APK_LINE" | sed 's/_/\\_/g')

          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            DL_LINE="[comot di sini](https://github.com/${GITHUB_REPOSITORY}/releases/tag/${GITHUB_REF_NAME})"
          else
            DL_LINE="[cek hasil build](https://github.com/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID})"
          fi

          curl -s -X POST "https://api.telegram.org/bot$TELEGRAM_BOT_TOKEN/sendMessage" \
            -d chat_id="$TELEGRAM_CHANNEL_ID" \
            -d parse_mode="Markdown" \
            -d text="
          ${PICK}

          ${APK_LINE} — ${DL_LINE}
          "

      # Extract version from pubspec.yaml for release naming
      - name: Read Version
        id: version
        run: |
          VERSION=$(grep '^version: ' pubspec.yaml | cut -d ' ' -f 2 | cut -d '+' -f 1)
          echo "VERSION=$VERSION" >> $GITHUB_ENV
          echo "Detected version: $VERSION"

      # Extract release notes from CHANGELOG.md for the current version
      # Priority: CHANGELOG.md version entry > [Unreleased] fallback > auto-generated from commits
      # Format matches CHANGELOG.md style with emojis, sections, and bullet points
      - name: Extract Changelog
        id: changelog
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          # Get full version from pubspec (e.g., 0.9.16+25)
          FULL_VERSION=$(grep '^version: ' pubspec.yaml | cut -d ' ' -f 2)
          TAG_NAME="${GITHUB_REF_NAME}"
          echo "Looking for CHANGELOG entry: [$FULL_VERSION]"

          # Extract section between ## [version] and next --- separator
          NOTES=$(awk -v ver="$FULL_VERSION" '
            BEGIN { found=0; output="" }
            /^## \[/ {
              if (found) exit
              if (index($0, "[" ver "]") > 0) found=1
            }
            found && /^---$/ { exit }
            found { output = output $0 "\n" }
            END { printf "%s", output }
          ' CHANGELOG.md)

          # If no exact match, try version without build number (e.g., 0.9.16)
          if [ -z "$NOTES" ]; then
            SHORT_VERSION=$(echo "$FULL_VERSION" | cut -d '+' -f 1)
            echo "Trying short version: [$SHORT_VERSION]"
            NOTES=$(awk -v ver="$SHORT_VERSION" '
              BEGIN { found=0; output="" }
              /^## \[/ {
                if (found) exit
                if (index($0, "[" ver "]") > 0) found=1
              }
              found && /^---$/ { exit }
              found { output = output $0 "\n" }
              END { printf "%s", output }
            ' CHANGELOG.md)
          fi

          # Fallback to [Unreleased] section if no version-specific entry
          if [ -z "$NOTES" ]; then
            echo "Trying [Unreleased] section..."
            NOTES=$(awk '
              BEGIN { found=0; output="" }
              /^## \[Unreleased\]/ { found=1; next }
              found && /^---$/ { exit }
              found && /^## \[/ { exit }
              found { output = output $0 "\n" }
              END { printf "%s", output }
            ' CHANGELOG.md)
            if [ -n "$NOTES" ]; then
              echo "✅ Using [Unreleased] section ($(echo "$NOTES" | wc -l) lines)"
              NOTES="## [$FULL_VERSION] - $(date +%Y-%m-%d)\n\n$NOTES"
            fi
          fi

          if [ -n "$NOTES" ]; then
            echo "✅ Found CHANGELOG entry ($(echo "$NOTES" | wc -l) lines)"
            echo "$NOTES" > release_notes.md
          else
            echo "⚠️ No CHANGELOG entry found, generating formatted notes..."

            # ─── Generate beautiful formatted release notes from commits ───
            # Get previous tag for commit range
            PREV_TAG=$(git describe --tags --abbrev=0 HEAD^ 2>/dev/null || echo "")

            if [ -n "$PREV_TAG" ]; then
              RANGE="${PREV_TAG}..HEAD"
            else
              RANGE="HEAD~20..HEAD"
            fi

            # Collect commits by type using conventional commit format
            FEAT_COMMITS=$(git log "$RANGE" --pretty=format:"%s" --no-merges 2>/dev/null | grep -iE "^feat" | sed 's/^feat[^:]*: //' || true)
            FIX_COMMITS=$(git log "$RANGE" --pretty=format:"%s" --no-merges 2>/dev/null | grep -iE "^fix" | sed 's/^fix[^:]*: //' || true)
            REFACTOR_COMMITS=$(git log "$RANGE" --pretty=format:"%s" --no-merges 2>/dev/null | grep -iE "^refactor" | sed 's/^refactor[^:]*: //' || true)
            DOCS_COMMITS=$(git log "$RANGE" --pretty=format:"%s" --no-merges 2>/dev/null | grep -iE "^docs" | sed 's/^docs[^:]*: //' || true)
            OTHER_COMMITS=$(git log "$RANGE" --pretty=format:"%s" --no-merges 2>/dev/null | grep -ivE "^(feat|fix|refactor|docs|chore|ci|build|style|test)" || true)

            # Build formatted release notes
            {
              echo "## [$FULL_VERSION] - $(date +%Y-%m-%d)"
              echo ""

              # ✨ Features
              if [ -n "$FEAT_COMMITS" ]; then
                echo "### ✨ New Features"
                echo "$FEAT_COMMITS" | while IFS= read -r line; do
                  [ -n "$line" ] && echo "- **${line}**"
                done
                echo ""
              fi

              # 🩹 Bug Fixes
              if [ -n "$FIX_COMMITS" ]; then
                echo "### 🩹 Bug Fixes"
                echo "$FIX_COMMITS" | while IFS= read -r line; do
                  [ -n "$line" ] && echo "- ${line}"
                done
                echo ""
              fi

              # ♻️ Refactor
              if [ -n "$REFACTOR_COMMITS" ]; then
                echo "### ♻️ Refactor"
                echo "$REFACTOR_COMMITS" | while IFS= read -r line; do
                  [ -n "$line" ] && echo "- ${line}"
                done
                echo ""
              fi

              # 📝 Documentation
              if [ -n "$DOCS_COMMITS" ]; then
                echo "### 📝 Documentation"
                echo "$DOCS_COMMITS" | while IFS= read -r line; do
                  [ -n "$line" ] && echo "- ${line}"
                done
                echo ""
              fi

              # 🔧 Other Changes
              if [ -n "$OTHER_COMMITS" ]; then
                echo "### 🔧 Other Changes"
                echo "$OTHER_COMMITS" | while IFS= read -r line; do
                  [ -n "$line" ] && echo "- ${line}"
                done
                echo ""
              fi

              # 📦 APK Info (universal kuron_* only)
              echo "### 📦 Build Artifacts"
              APK_COUNT=0
              for apk in apk-output/kuron_*.apk build/app/outputs/flutter-apk/kuron_*.apk; do
                if [ -f "$apk" ]; then
                  filename=$(basename "$apk")
                  size=$(du -h "$apk" | cut -f1)
                  echo "- 📱 \`${filename}\` — ${size}"
                  APK_COUNT=$((APK_COUNT + 1))
                fi
              done
              if [ "$APK_COUNT" -eq 0 ]; then
                echo "- _APK files available in assets below_"
              fi
              echo ""

              # Full Changelog link
              if [ -n "$PREV_TAG" ]; then
                echo "**Full Changelog**: [\`${PREV_TAG}...${TAG_NAME}\`](https://github.com/${GITHUB_REPOSITORY}/compare/${PREV_TAG}...${TAG_NAME})"
              fi
            } > release_notes.md
          fi

          echo "📝 Release notes preview:"
          cat release_notes.md
          echo "HAS_NOTES=true" >> $GITHUB_ENV

      # DISABLED: Upload APK to Telegram Channel (User Request)
      # - name: Upload APK to Telegram Channel
      #   if: success()
      #   ... (disabled)

      # Create Release & Upload APK to GitHub (kuron_* universal only — single file, no duplicates)
      # Only triggered when a version tag (v*) is pushed
      - name: Create GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          name: "v${{ env.VERSION }} 🚀"
          files: |
            apk-output/kuron_*.apk
          body_path: release_notes.md
          draft: false
          prerelease: false
          fail_on_unmatched_files: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
